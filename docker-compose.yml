services:
  forgejo-mcp:
    # image: richarvey/forgejo-mcp:latest
    build: .
    ports:
      - "3000:3000"
    environment:
      - FORGEJO_URL=${FORGEJO_URL}
      - FORGEJO_TOKEN=${FORGEJO_TOKEN}
      # Required: port 3000 is published on every interface, so the endpoint must
      # not start unauthenticated. Compose refuses to start when this is unset or empty.
      - "FORGEJO_MCP_API_KEY=${FORGEJO_MCP_API_KEY:?FORGEJO_MCP_API_KEY must be set (for example in .env). Generate one with 'openssl rand -hex 32'}"
      - FORGEJO_DISABLED_AREAS=${FORGEJO_DISABLED_AREAS:-}
      - PORT=3000
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW_MS=60000
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
